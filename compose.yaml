services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: accessreview
      POSTGRES_USER: accessreview
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessreview -d accessreview"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://accessreview:${DB_PASSWORD}@db:5432/accessreview
      WIN01_KEY: ${WIN01_KEY:?Set WIN01_KEY}
      WIN02_KEY: ${WIN02_KEY:?Set WIN02_KEY}
      LINUX01_KEY: ${LINUX01_KEY:?Set LINUX01_KEY}
      LINUX02_KEY: ${LINUX02_KEY:?Set LINUX02_KEY}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
